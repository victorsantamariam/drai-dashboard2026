<!DOCTYPE html>
<html>
<head>
<title>DRAI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
h1 { text-align: center; color: #333; margin-bottom: 10px; }
.subtitle { text-align: center; color: #666; margin-bottom: 20px; }
.upload { border: 2px dashed #667eea; padding: 30px; text-align: center; background: #f8f9fa; cursor: pointer; border-radius: 10px; margin: 20px 0; }
.upload:hover { background: #e8eaf6; }
button { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 10px; }
button:hover { background: #764ba2; }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
.card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #667eea; text-align: center; }
.value { font-size: 2em; font-weight: bold; color: #667eea; }
.label { font-size: 0.9em; color: #999; text-transform: uppercase; margin-top: 10px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin: 30px 0; }
.chart-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
table { width: 100%; border-collapse: collapse; margin: 30px 0; }
th { background: #667eea; color: white; padding: 15px; text-align: left; }
td { padding: 12px; border-bottom: 1px solid #eee; }
tr:hover { background: #f8f9fa; }
.success { background: #e0ffe0; color: #060; padding: 15px; border-radius: 5px; margin: 20px 0; }
</style>
</head>
<body>
<div class="container">
<h1>📊 DRAI Dashboard Interactivo</h1>
<p class="subtitle">Análisis Completo de Actividades por Área</p>

<div class="upload" id="upload">
<p>📁 Arrastra DOCX/ZIP o haz click</p>
</div>

<div style="text-align: center;">
<input type="file" id="f" multiple accept=".docx,.zip" style="display:none;">
<button onclick="document.getElementById('f').click()">Seleccionar</button>
<button onclick="send()">Procesar</button>
</div>

<div id="result"></div>
</div>

<script>
const API = 'https://drai-dashboard-backend.onrender.com/api/upload';
document.getElementById('upload').addEventListener('click', () => document.getElementById('f').click());

async function send() {
const files = document.getElementById('f').files;
if (!files.length) return;
const fd = new FormData();
for (let f of files) fd.append('files', f);
document.getElementById('result').innerHTML = '<div style="text-align:center">⏳ Procesando...</div>';
try {
const r = await fetch(API, {method: 'POST', body: fd});
const d = await r.json();
if (d.success) show(d.data);
else document.getElementById('result').innerHTML = '<p style="color:red">Error: ' + d.error + '</p>';
} catch(e) { document.getElementById('result').innerHTML = '<p style="color:red">Error: ' + e + '</p>'; }
}

function show(data) {
const areas = data.areas || {};
const total = data.total_activities;

let html = '<div class="success">✅ Procesado: ' + total.toLocaleString() + ' actividades</div>';
html += '<div class="kpi">';
html += '<div class="card"><div class="value">' + (data.total_files || 0) + '</div><div class="label">Archivos</div></div>';
html += '<div class="card"><div class="value">' + total.toLocaleString() + '</div><div class="label">Total</div></div>';
html += '</div>';

html += '<div class="charts"><div class="chart-box"><canvas id="pie"></canvas></div><div class="chart-box"><canvas id="bar"></canvas></div></div>';

html += '<h3>Desglose por Área</h3>';
html += '<table><thead><tr><th>Área</th><th style="text-align:right">Actividades</th><th style="text-align:right">%</th></tr></thead><tbody>';

const labels = [];
const values = [];
for (let a in areas) {
const v = areas[a] || 0;
if (v > 0) {
labels.push(a);
values.push(v);
const pct = ((v/total)*100).toFixed(1);
html += '<tr><td>' + a + '</td><td style="text-align:right">' + v.toLocaleString() + '</td><td style="text-align:right">' + pct + '%</td></tr>';
}
}

html += '</tbody></table>';
document.getElementById('result').innerHTML = html;

setTimeout(() => {
new Chart(document.getElementById('pie'), {
type: 'doughnut',
data: {
labels: labels,
datasets: [{
data: values,
backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b', '#fa709a', '#fee140', '#30cfd0']
}]
},
options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
});

new Chart(document.getElementById('bar'), {
type: 'bar',
data: { labels: labels, datasets: [{ label: 'Actividades', data: values, backgroundColor: '#667eea' }] },
options: { responsive: true, indexAxis: 'y' }
});
}, 100);
}
</script>
</body>
</html>
