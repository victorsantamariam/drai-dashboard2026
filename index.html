<!DOCTYPE html>
<html>
<head>
<title>DRAI Dashboard 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Segoe UI', Arial; 
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 30px 20px;
}
.container { 
  max-width: 1400px; 
  margin: 0 auto;
  background: white;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.3);
}
h1 { 
  text-align: center;
  color: #333;
  margin-bottom: 5px;
  font-size: 2.5em;
}
.subtitle { 
  text-align: center;
  color: #666;
  margin-bottom: 30px;
  font-size: 0.95em;
}
.upload-section {
  background: linear-gradient(135deg, #667eea15, #764ba215);
  border: 2px dashed #667eea;
  padding: 40px;
  text-align: center;
  border-radius: 12px;
  margin-bottom: 30px;
  cursor: pointer;
  transition: all 0.3s;
}
.upload-section:hover { 
  background: linear-gradient(135deg, #667eea25, #764ba225);
  border-color: #764ba2;
}
.upload-section p { 
  color: #667eea;
  font-size: 1.1em;
  font-weight: bold;
}
.button-group {
  text-align: center;
  margin-bottom: 30px;
}
button {
  background: #667eea;
  color: white;
  padding: 12px 30px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1em;
  font-weight: bold;
  margin: 0 10px;
  transition: all 0.3s;
}
button:hover { background: #764ba2; transform: translateY(-2px); }
input[type="file"] { display: none; }
.success-msg {
  background: #e0ffe0;
  color: #060;
  padding: 15px;
  border-radius: 8px;
  margin: 20px 0;
  border-left: 5px solid #0a0;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.kpi-card {
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  border-left: 5px solid #667eea;
  text-align: center;
  transition: all 0.3s;
}
.kpi-card:hover { 
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.kpi-value {
  font-size: 2em;
  font-weight: bold;
  color: #667eea;
  margin: 10px 0;
}
.kpi-label {
  font-size: 0.85em;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.charts-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
  gap: 30px;
  margin-bottom: 40px;
}
.chart-box {
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
.chart-title {
  font-size: 1.2em;
  font-weight: bold;
  color: #333;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 2px solid #667eea;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
th {
  background: #667eea;
  color: white;
  padding: 12px;
  text-align: left;
  font-weight: bold;
}
td {
  padding: 12px;
  border-bottom: 1px solid #eee;
}
tr:hover { background: #f8f9fa; }
.loading {
  text-align: center;
  color: #667eea;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
<h1>📊 DRAI Dashboard 2026</h1>
<p class="subtitle">Departamento de Recursos de Apoyo e Informática | Análisis Integral</p>

<div class="upload-section" id="upload">
<p>📁 Arrastra tus archivos DOCX/ZIP aquí o haz click</p>
</div>

<div class="button-group">
<input type="file" id="files" multiple accept=".docx,.zip">
<button onclick="document.getElementById('files').click()">📤 Seleccionar Archivos</button>
<button onclick="procesar()">⚙️ Procesar</button>
</div>

<div id="result"></div>
</div>

<script>
const API = 'https://drai-dashboard-backend.onrender.com/api/upload';

document.getElementById('upload').addEventListener('click', () => document.getElementById('files').click());

async function procesar() {
  const files = document.getElementById('files').files;
  if (!files.length) return alert('Selecciona archivos primero');
  
  const fd = new FormData();
  for (let f of files) fd.append('files', f);
  
  document.getElementById('result').innerHTML = '<div class="loading">⏳ Procesando archivos...</div>';
  
  try {
    const r = await fetch(API, {method: 'POST', body: fd});
    const d = await r.json();
    if (d.success) mostrar(d.data);
    else document.getElementById('result').innerHTML = '<p style="color:red">❌ Error: ' + d.error + '</p>';
  } catch(e) {
    document.getElementById('result').innerHTML = '<p style="color:red">❌ Error de conexión: ' + e + '</p>';
  }
}

function mostrar(data) {
  const areas = data.areas || {};
  const total = data.total_activities || 0;
  
  let html = '<div class="success-msg">✅ Procesado correctamente: ' + total.toLocaleString() + ' actividades en ' + (data.total_files || 0) + ' archivo(s)</div>';
  
  // KPI Cards
  html += '<div class="kpi-grid">';
  html += '<div class="kpi-card"><div class="kpi-label">Total Actividades</div><div class="kpi-value">' + total.toLocaleString() + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Archivos</div><div class="kpi-value">' + (data.total_files || 0) + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Áreas</div><div class="kpi-value">' + Object.keys(areas).filter(a => areas[a] > 0).length + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Promedio/Área</div><div class="kpi-value">' + (total > 0 ? Math.round(total / Object.keys(areas).length) : 0).toLocaleString() + '</div></div>';
  html += '</div>';
  
  // Gráficos
  const labels = [];
  const values = [];
  const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#00f2fe', '#43e97b', '#fa709a', '#fee140', '#30cfd0'];
  
  for (let a in areas) {
    const v = areas[a] || 0;
    if (v > 0) {
      labels.push(a);
      values.push(v);
    }
  }
  
  html += '<div class="charts-section">';
  html += '<div class="chart-box"><div class="chart-title">📊 Actividades por Área</div><canvas id="barChart"></canvas></div>';
  html += '<div class="chart-box"><div class="chart-title">🥧 Distribución</div><canvas id="doughnutChart"></canvas></div>';
  html += '</div>';
  
  // Tabla
  html += '<div style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">';
  html += '<h2 style="margin-bottom: 20px; color: #333;">📋 Desglose Detallado</h2>';
  html += '<table>';
  html += '<thead><tr><th>Área</th><th style="text-align:right">Actividades</th><th style="text-align:right">Porcentaje</th></tr></thead><tbody>';
  
  for (let i = 0; i < labels.length; i++) {
    const pct = ((values[i]/total)*100).toFixed(1);
    html += '<tr><td>' + labels[i] + '</td><td style="text-align:right"><strong>' + values[i].toLocaleString() + '</strong></td><td style="text-align:right">' + pct + '%</td></tr>';
  }
  
  html += '</tbody></table>';
  html += '</div>';
  
  document.getElementById('result').innerHTML = html;
  
  // Gráficos
  setTimeout(() => {
    new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Actividades',
          data: values,
          backgroundColor: colors.slice(0, labels.length),
          borderRadius: 5
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: { legend: { display: false } }
      }
    });
    
    new Chart(document.getElementById('doughnutChart'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: values,
          backgroundColor: colors.slice(0, labels.length),
          borderColor: '#fff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }, 100);
}
</script>
</body>
</html>
