<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAI Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #667eea; padding: 40px; border-radius: 10px; text-align: center; background: #f8f9fa; cursor: pointer; margin: 20px 0; }
        .upload-area:hover { background: #e8eaf6; }
        button { background: #667eea; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background: #764ba2; }
        #results { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .success { background: #e0ffe0; color: #060; padding: 15px; border-radius: 5px; }
        .error { background: #ffe0e0; color: #c00; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 DRAI Dashboard</h1>
        <p style="text-align: center; color: #666;">Cargador de Archivos DOCX/ZIP</p>
        
        <div class="upload-area" id="uploadArea">
            <p>Arrastra archivos aquí o haz click</p>
        </div>
        
        <div style="text-align: center;">
            <input type="file" id="fileInput" multiple accept=".docx,.zip" style="display:none;">
            <button onclick="document.getElementById('fileInput').click()">Seleccionar Archivos</button>
            <button onclick="uploadFiles()" style="margin-left: 10px;">Procesar</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'https://drai-dashboard-backend.onrender.com';
        
        document.getElementById('uploadArea').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });
        
        async function uploadFiles() {
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) {
                alert('Selecciona archivos');
                return;
            }
            
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }
            
            try {
                const response = await fetch(API_BASE + '/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('results').innerHTML = '<div class="success"><h3>✅ Exitoso</h3><p>Total Actividades: ' + data.data.total_activities + '</p></div>';
                } else {
                    document.getElementById('results').innerHTML = '<div class="error">❌ Error: ' + data.error + '</div>';
                }
            } catch (error) {
                document.getElementById('results').innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
