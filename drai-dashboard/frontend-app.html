<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAI Dashboard - Cargador de Archivos</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5em;
            color: #2d3436;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #e8eaf6;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8eaf6;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            color: #636e72;
            margin-bottom: 10px;
        }

        .upload-subtext {
            font-size: 0.95em;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        .button {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name {
            font-weight: 600;
            color: #2d3436;
        }

        .file-size {
            color: #999;
            font-size: 0.9em;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-btn:hover {
            background: #cc5555;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard {
            margin-top: 40px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
            text-align: center;
        }

        .kpi-label {
            font-size: 0.85em;
            color: #636e72;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }

        .success {
            background: #e0ffe0;
            color: #060;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        tr:hover {
            background: #e8eaf6;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #636e72;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useRef, useEffect } = React;

        function App() {
            const [files, setFiles] = useState([]);
            const [loading, setLoading] = useState(false);
            const [report, setReport] = useState(null);
            const [error, setError] = useState(null);
            const [dragover, setDragover] = useState(false);
            const fileInputRef = useRef(null);

              const API_BASE = 'https://drai-dashboard-backend.onrender.com';

            const handleDrop = (e) => {
                e.preventDefault();
                setDragover(false);
                const droppedFiles = Array.from(e.dataTransfer.files);
                addFiles(droppedFiles);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragover(true);
            };

            const handleDragLeave = () => {
                setDragover(false);
            };

            const addFiles = (newFiles) => {
                const validFiles = newFiles.filter(f =>
                    f.name.endsWith('.docx') || f.name.endsWith('.zip')
                );
                setFiles([...files, ...validFiles]);
                setError(null);
            };

            const removeFile = (index) => {
                setFiles(files.filter((_, i) => i !== index));
            };

            const handleUpload = async () => {
                if (files.length === 0) {
                    setError('Por favor, selecciona al menos un archivo');
                    return;
                }

                setLoading(true);
                setError(null);

                try {
                    const formData = new FormData();
                    files.forEach(file => formData.append('files', file));

                    const response = await fetch(`${API_BASE}/api/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('Error al procesar archivos');
                    }

                    const data = await response.json();
                    setReport(data.data);
                    setFiles([]);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const downloadReport = () => {
                const element = document.createElement('a');
                element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(JSON.stringify(report, null, 2)));
                element.setAttribute('download', `reporte_${Date.now()}.json`);
                element.style.display = 'none';
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>📊 DRAI Dashboard</h1>
                        <p>Cargador de Archivos DOCX/ZIP</p>
                    </div>

                    <div className="content">
                        {!report ? (
                            <>
                                <div className="section">
                                    <div className="section-title">Carga tus archivos</div>
                                    <div
                                        className={`upload-area ${dragover ? 'dragover' : ''}`}
                                        onDrop={handleDrop}
                                        onDragOver={handleDragOver}
                                        onDragLeave={handleDragLeave}
                                        onClick={() => fileInputRef.current?.click()}
                                    >
                                        <div className="upload-icon">📁</div>
                                        <div className="upload-text">Arrastra tus archivos aquí</div>
                                        <div className="upload-subtext">o haz clic para seleccionar</div>
                                        <input
                                            ref={fileInputRef}
                                            type="file"
                                            multiple
                                            accept=".docx,.zip"
                                            onChange={(e) => addFiles(Array.from(e.target.files))}
                                        />
                                        <button className="button" onClick={() => fileInputRef.current?.click()}>
                                            Seleccionar archivos
                                        </button>
                                    </div>
                                </div>

                                {files.length > 0 && (
                                    <div className="section">
                                        <div className="section-title">Archivos seleccionados ({files.length})</div>
                                        <div className="file-list">
                                            {files.map((file, idx) => (
                                                <div key={idx} className="file-item">
                                                    <div>
                                                        <div className="file-name">📄 {file.name}</div>
                                                        <div className="file-size">{(file.size / 1024).toFixed(2)} KB</div>
                                                    </div>
                                                    <button
                                                        className="remove-btn"
                                                        onClick={() => removeFile(idx)}
                                                    >
                                                        Eliminar
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <button
                                            className="button"
                                            onClick={handleUpload}
                                            disabled={loading}
                                            style={{ width: '100%', marginTop: '20px' }}
                                        >
                                            {loading ? 'Procesando...' : 'Procesar Archivos'}
                                        </button>
                                    </div>
                                )}

                                {error && (
                                    <div className="error">❌ {error}</div>
                                )}

                                {loading && (
                                    <div className="loading">
                                        <div className="spinner"></div>
                                        <p>Procesando archivos...</p>
                                    </div>
                                )}
                            </>
                        ) : (
                            <>
                                <div className="success">
                                    ✅ Archivos procesados exitosamente
                                </div>

                                <div className="dashboard">
                                    <div className="section-title">Resultado del Dashboard</div>

                                    <div className="kpi-grid">
                                        <div className="kpi-card">
                                            <div className="kpi-label">Total de Archivos</div>
                                            <div className="kpi-value">{report.total_files}</div>
                                        </div>
                                        <div className="kpi-card">
                                            <div className="kpi-label">Total de Tablas</div>
                                            <div className="kpi-value">{report.total_tables}</div>
                                        </div>
                                        <div className="kpi-card">
                                            <div className="kpi-label">Total de Actividades</div>
                                            <div className="kpi-value">{report.total_activities.toLocaleString()}</div>
                                        </div>
                                        <div className="kpi-card">
                                            <div className="kpi-label">Promedio por Archivo</div>
                                            <div className="kpi-value">
                                                {report.total_files > 0
                                                    ? Math.round(report.total_activities / report.total_files).toLocaleString()
                                                    : 0
                                                }
                                            </div>
                                        </div>
                                    </div>

                                    {report.files_processed && report.files_processed.length > 0 && (
                                        <div className="section">
                                            <div className="section-title">Detalle de Archivos Procesados</div>
                                            <table>
                                                <thead>
                                                    <tr>
                                                        <th>Archivo</th>
                                                        <th>Actividades</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {report.files_processed.map((file, idx) => (
                                                        <tr key={idx}>
                                                            <td>{file.name}</td>
                                                            <td>{file.activities.toLocaleString()}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    <button
                                        className="button"
                                        onClick={downloadReport}
                                        style={{ marginTop: '20px', marginRight: '10px' }}
                                    >
                                        📥 Descargar Reporte (JSON)
                                    </button>
                                    <button
                                        className="button"
                                        onClick={() => {
                                            setReport(null);
                                            setFiles([]);
                                        }}
                                        style={{ marginTop: '20px' }}
                                    >
                                        ➕ Procesar más archivos
                                    </button>
                                </div>
                            </>
                        )}
                    </div>

                    <footer>
                        <p>DRAI Dashboard v1.0 | Procesador de Archivos DOCX/ZIP</p>
                        <p>© 2026 DRAI</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
